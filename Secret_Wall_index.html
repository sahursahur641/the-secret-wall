<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#201923"><title>The Secret Wall</title>
<style>
:root{color-scheme:light dark;--bg:#f6f3ee;--card:#fff;--ink:#28212a;--muted:#756d76;--accent:#923d5b;--line:#e8dfe4}@media(prefers-color-scheme:dark){:root{--bg:#17141a;--card:#241f28;--ink:#f6eef2;--muted:#b8aeb8;--accent:#e28aa8;--line:#403541}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}main{max-width:720px;margin:auto;padding:28px 16px 60px}header{text-align:center;margin:12px 0 24px}h1{font-size:clamp(2rem,8vw,3rem);margin:0}header p{color:var(--muted);font-style:italic}.notice,.panel,.post{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:14px 0}.notice{font:13px/1.45 system-ui;color:var(--muted)}textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}textarea{min-height:130px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}label{font:12px system-ui;color:var(--muted)}label input{display:block;margin-top:5px;font:14px system-ui}.bar,.tools{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:12px;font:13px system-ui;color:var(--muted)}button{border:0;border-radius:999px;background:var(--accent);color:white;padding:11px 16px;font:600 14px system-ui;cursor:pointer}.tools input{flex:1;min-width:100px}h2{font:700 13px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:28px 2px 10px}.post p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 10px}.meta,.small{font:12px system-ui;color:var(--muted)}.song{font:13px system-ui;background:var(--bg);border-radius:10px;padding:9px;margin:8px 0}.song a{color:#1db954;text-decoration:none;font-weight:700}.reactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.reactions button{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:7px 10px}.empty{text-align:center;color:var(--muted);padding:22px;font:14px system-ui}@media(max-width:480px){.fields{grid-template-columns:1fr}}
</style></head><body><main><header><h1>The Secret Wall 🤫</h1><p>A little space for things you want to say.</p></header>
<div class="notice"><b>Preview only:</b> Posts and reactions are saved only in this browser on this device. They are not shared with other visitors yet. Don't enter names, contact details, addresses, or other private information.</div>
<section class="panel"><textarea id="secret" maxlength="1200" placeholder="Type your confession here..."></textarea><div class="fields"><label>Initials (optional)<input id="initials" maxlength="3" placeholder="ABC"></label><label>Song (optional)<input id="song" maxlength="80" placeholder="Song title"></label><label>Artist (optional)<input id="artist" maxlength="60" placeholder="Artist name"></label></div><div class="bar"><span id="count">0 / 1200</span><button id="submit">Submit confession</button></div><div id="status" class="small"></div></section>
<div class="tools"><input id="search" placeholder="Search confessions..." type="search"><button id="clear">Clear local posts</button></div><h2>Confessions</h2><section id="wall"></section></main>
<script>
const KEY='secret-wall-preview-v1', $=id=>document.getElementById(id);let posts=[];try{posts=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const save=()=>localStorage.setItem(KEY,JSON.stringify(posts));
$('secret').addEventListener('input',()=>$('count').textContent=$('secret').value.length+' / 1200');
function render(){let q=$('search').value.toLowerCase().trim(),wall=$('wall');wall.replaceChildren();let list=posts.filter(p=>(p.text+' '+p.initials+' '+p.song+' '+p.artist).toLowerCase().includes(q));if(!list.length){let d=document.createElement('div');d.className='empty';d.textContent=posts.length?'No matching confessions.':'No confessions yet. Add one above.';wall.append(d);return}list.slice().reverse().forEach(p=>{let c=document.createElement('article');c.className='post';let t=document.createElement('p');t.textContent=p.text;c.append(t);if(p.song){let s=document.createElement('div');s.className='song';let span=document.createElement('span');span.textContent='🎵 '+p.song+(p.artist?' — '+p.artist:'')+' · ';let a=document.createElement('a');a.textContent='Search Spotify';a.href='https://open.spotify.com/search/'+encodeURIComponent(p.song+' '+p.artist);a.target='_blank';a.rel='noopener noreferrer';s.append(span,a);c.append(s)}if(p.initials){let b=document.createElement('div');b.className='meta';b.textContent='— '+p.initials.split('').join('.')+'.';c.append(b)}let date=document.createElement('div');date.className='meta';date.textContent=new Date(p.time).toLocaleDateString();c.append(date);let r=document.createElement('div');r.className='reactions';['❤️','🤍','😂','😮','🥺'].forEach(e=>{let b=document.createElement('button');b.textContent=e+' '+(p.reactions[e]||0);b.onclick=()=>{p.reactions[e]=(p.reactions[e]||0)+1;save();render()};r.append(b)});c.append(r);wall.append(c)})}
$('submit').onclick=()=>{let text=$('secret').value.trim();if(text.length<3){$('status').textContent='Please write at least 3 characters.';return}posts.push({text,initials:$('initials').value.replace(/[^a-z]/gi,'').toUpperCase().slice(0,3),song:$('song').value.trim(),artist:$('artist').value.trim(),time:Date.now(),reactions:{}});save();$('secret').value='';$('initials').value='';$('song').value='';$('artist').value='';$('count').textContent='0 / 1200';$('status').textContent='Saved in this browser preview.';render()};$('search').oninput=render;$('clear').onclick=()=>{if(confirm('Delete all posts saved in this browser?')){posts=[];save();render();$('status').textContent='Local posts cleared.'}};render();
</script></body></html>
